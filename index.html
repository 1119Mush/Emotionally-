<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 心靈小物研究所 · 八元素靈魂圖鑑</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF8F0;
  --lavender:#D9C7FF;
  --mint:#B8F2E6;
  --peach:#FFD6C9;
  --sky:#C9E4FF;
  --ink:#4A4A4A;
  --ink-soft:#8a8a8a;
  --shadow:0 8px 24px rgba(120,110,160,.12);
  --radius:24px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:
    radial-gradient(1200px 600px at 10% -10%,#FFE8F0 0%,transparent 55%),
    radial-gradient(900px 500px at 100% 0%,#E0F0FF 0%,transparent 50%),
    radial-gradient(800px 800px at 50% 110%,#EAE3FF 0%,transparent 55%),
    var(--cream);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:760px;margin:0 auto;padding:24px 18px 80px;position:relative;z-index:1}

/* 漂浮裝飾 */
.floaties{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaty{position:absolute;font-size:22px;opacity:.28;animation:floatUp linear infinite}
@keyframes floatUp{
  0%{transform:translateY(10vh) rotate(0)}
  100%{transform:translateY(-110vh) rotate(360deg)}
}

/* 通用卡片 */
.card{
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.85);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:26px 22px;
}
.screen{display:none;animation:fadeUp .55s cubic-bezier(.2,.8,.2,1)}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- 登入頁 ---------- */
.hero{text-align:center;padding:44px 22px 36px}
.badge{
  display:inline-block;font-size:.75rem;letter-spacing:.18em;
  color:#8a6fb0;background:#F0E7FF;border:1px solid #E0D0FF;
  padding:6px 16px;border-radius:999px;margin-bottom:20px;
}
.hero h1{
  font-size:clamp(1.7rem,6vw,2.5rem);font-weight:700;line-height:1.35;
  background:linear-gradient(120deg,#7B6BB5,#5B9BC7 50%,#7BB5A0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:14px;
}
.hero .sub{color:var(--ink-soft);font-size:clamp(.85rem,2.8vw,1rem);line-height:1.9;margin-bottom:28px}
.orb-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:32px}
.orb{
  width:clamp(42px,11vw,54px);height:clamp(42px,11vw,54px);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.1rem,3.5vw,1.4rem);
  box-shadow:0 6px 16px rgba(0,0,0,.08);border:2px solid rgba(255,255,255,.9);
  animation:bob 3.4s ease-in-out infinite;
}
.orb:nth-child(2){animation-delay:.3s}
.orb:nth-child(3){animation-delay:.6s}
.orb:nth-child(4){animation-delay:.9s}
.orb:nth-child(5){animation-delay:1.2s}
.orb:nth-child(6){animation-delay:1.5s}
.orb:nth-child(7){animation-delay:1.8s}
.orb:nth-child(8){animation-delay:2.1s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

.btn{
  display:inline-block;border:none;cursor:pointer;
  padding:15px 40px;border-radius:999px;
  font-size:1rem;font-weight:700;font-family:inherit;color:#fff;
  background:linear-gradient(120deg,#9B87D9,#7BB5D9);
  box-shadow:0 10px 24px rgba(140,120,200,.32);
  transition:transform .18s,box-shadow .18s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(140,120,200,.4)}
.btn:active{transform:scale(.97)}
.btn.ghost{
  background:rgba(255,255,255,.9);color:#7B6BB5;
  border:1.5px solid #DCCEFF;box-shadow:0 6px 16px rgba(160,140,210,.15);
  padding:12px 30px;font-size:.92rem;
}
.btn.ghost:hover{background:#F5EEFF}

.disclaimer{
  margin-top:26px;font-size:.72rem;color:#a8a0b8;line-height:1.8;
  max-width:420px;margin-left:auto;margin-right:auto;
}

/* ---------- 測驗頁 ---------- */
.quiz-head{margin-bottom:18px}
.progress-track{
  height:10px;border-radius:999px;background:rgba(255,255,255,.75);
  overflow:hidden;box-shadow:inset 0 1px 3px rgba(140,120,180,.15);
}
.progress-fill{
  height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,#B8A4E8,#7BC7D9,#9BE0C0);
  transition:width .4s cubic-bezier(.4,0,.2,1);
}
.quiz-meta{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:12px;font-size:.8rem;color:var(--ink-soft);font-weight:500;
}
.q-num{font-weight:700;color:#8B76C4}

.q-card{padding:28px 22px}
.q-text{
  font-size:clamp(1.02rem,3.6vw,1.22rem);font-weight:700;line-height:1.75;
  margin-bottom:22px;
}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  display:flex;align-items:flex-start;gap:12px;
  padding:16px 18px;border-radius:16px;cursor:pointer;
  background:rgba(255,255,255,.8);
  border:1.5px solid rgba(220,210,240,.7);
  font-size:.94rem;line-height:1.65;font-family:inherit;color:var(--ink);
  text-align:left;width:100%;
  transition:all .18s;
}
.opt:hover{
  border-color:#C4B0F0;background:#FBF8FF;
  transform:translateX(4px);box-shadow:0 6px 16px rgba(160,140,220,.14);
}
.opt:active{transform:scale(.985)}
.opt .key{
  flex-shrink:0;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#EFE7FF;color:#8B76C4;font-size:.78rem;font-weight:700;
  transition:all .18s;
}
.opt:hover .key{background:#8B76C4;color:#fff}
.opt.selected{
  border-color:#8B76C4;background:#F5EEFF;
  box-shadow:0 0 0 3px rgba(139,118,196,.14);
}
.opt.selected .key{background:#8B76C4;color:#fff}

.nav-row{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.nav-row .btn{flex:1;padding:13px 20px;font-size:.9rem}

/* ---------- 結果頁 ---------- */
.result-hero{text-align:center;padding:38px 22px 30px;margin-bottom:18px}
.mascot{
  width:clamp(120px,32vw,160px);height:clamp(120px,32vw,160px);
  margin:0 auto 20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(3.4rem,14vw,4.6Brem);
  border:5px solid rgba(255,255,255,.95);
  box-shadow:0 16px 40px rgba(140,120,190,.22);
  animation:pop .7s cubic-bezier(.2,1.4,.4,1) both, glow 3.5s ease-in-out infinite 0.7s;
}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 16px 40px rgba(140,120,190,.22)}50%{box-shadow:0 16px 54px rgba(140,120,190,.42)}}

.combo-label{
  font-size:.72rem;letter-spacing:.22em;color:#9B8BC4;font-weight:700;margin-bottom:10px;
}
.combo-name{
  font-size:clamp(1.5rem,6vw,2.1rem);font-weight:700;line-height:1.4;
  background:linear-gradient(120deg,#76BB5,#5B9BC7 60%,#7BB5A0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:8px;
}
.combo-sub{font-size:.86rem;color:var(--ink-soft)}

.element-chips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}
.chip{
  padding:7px 16px;border-radius:999px;font-size:.78rem;font-weight:700;
  border:1.5px solid rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(0,0,0,.07);
}
.chip.main{color:#fff}
.chip.sub{background:rgba(255,255,255,.9)}

.section{margin-bottom:16px}
.section h2{
  font-size:1.05rem;font-weight:700;margin-bottom:14px;
  display:flex;align-items:center;gap:9px;
}
.section h2 .ico{
  width:32px;height:32px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  background:linear-gradient(135deg,#EFE7FF,#E0F0FF);
}
.section p{font-size:.92rem;line-height:2;color:#5a5a5a}

/* 雷達圖 */
.radar-box{display:flex;justify-content:center;padding:6px 0 4px}
#radar{max-width:100%;height:auto}

/* 元素分數列表 */
.score-list{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.score-row{display:flex;align-items:center;gap:11px;font-size:.83rem}
.score-row .name{width:52px;flex-shrink:0;font-weight:700}
.score-row .bar-wrap{flex:1;height:10px;border-radius:999px;background:rgba(255,255,255,.8);overflow:hidden;box-shadow:inset 0 1px 3px rgba(140,120,180,.12)}
.score-row .bar{height:100%;border-radius:999px;width:0;transition:width 1s cubic-bezier(.4,0,.2,1)}
.score-row .pct{widthink:42px;text-align:right;flex-shrink:0;color:var(---soft);font-weight:700}

/* 分享卡 */
.share-card{
  border-radius:22px;padding:28px 24px;text-align:center;color:#fff;
  box-shadow:0 16px 40px rgba(120,110,160,.28);position:relative;overflow:hidden;
}
.share-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 45%),
             radial-gradient(circle at 85% 90%,rgba(255,255,255,.25),transparent 45%);
}
.share-card > *{position:relative;z-index:1}
.share-card .sc-emoji{font-size:3rem;margin-bottom:10px;display:block}
.share-card .sc-title{font-size:1.35rem;font-weight:700;margin-bottom:6px}
.share-card .sc-tag{font-size:.75rem;letter-spacing:.2em;opacity:.85;margin-bottom:16px}
.share-card .sc-quote{font-size:.88rem;line-height:1.9;opacity:.96;font-style:italic}
.share-card .sc-foot{font-size:.68rem;opacity:.75;margin-top:18px;letter-spacing:.1em}

.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.btn-row .btn{flex:1;min-width:140px;padding:13px 20px;font-size:.88rem}

@media(max-width:480px){
  .wrap{padding:16px 14px 70px}
  .card{padding:20px 16px}
  .q-card{padding:22px 16px}
  .opt{padding:14px 15px;font-size:.9rem}
  .btn{padding:14px 32px;font-size:.94rem}
}
</style>
</head>
<body>
<div class="floaties" id="floaties"></div>

<div class="wrap">

<!-- ============ 登入頁 ============ -->
<section class="screen active" id="screen-landing">
  <div class="card hero">
    <div class="badge">心靈小物研究所</div>
    <h1>搵返你心島上<br>嘅專屬小物</h1>
    <p class="sub">
      每個人心入面都有一座「心島」，<br>
      由八種心靈元素組成，只係比例唔同。<br>
      答完 36 條情境題，你會遇見屬於你嘅代表物。
    </p>

    <div class="orb-row">
      <div class="orb" style="background:#FFD6C9">🔥</div>
      <div class="orb" style="background:#C9E4FF">🌊</div>
      <div class="orb" style="background:#B8F2E6">🌿</div>
      <div class="orb" style="background:#E4D9FF">✨</div>
      <div class="orb" style="background:#D8DEE9">⚙️</div>
      <div class="orb" style="background:#DCE6F5">🌙</div>
      <div class="orb" style="background:#FFD6E4">🍬</div>
      <div class="orb" style="background:#FFE8C4">🧸</div>
    </div>

    <button class="btn" onclick="startQuiz()">開始探索 ✦</button>

    <p class="disclaimer">
      ⚠️ 本測試為娛樂及自我反思工具，並非臨床心理診斷，<br>
      不能代替專業心理諮詢。請以成長語言看待結果。
    </p>
  </div>
</section>

<!-- ============ 測驗頁 ============ -->
<section class="screen" id="screen-quiz">
  <div class="quiz-head">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="quiz-meta">
      <span class="q-num" id="qCounter">第 1 / 36 題</span>
      <span id="qSection">日常篇</span>
    </div>
  </div>

  <div class="card q-card">
    <div class="q-text" id="qText"></div>
    <div class="opts" id="opts"></div>
  </div>

  <div class="nav-row">
    <button class="btn ghost" onclick="prevQ()" id="btnPrev">← 上一題</button>
    <button class="btn ghost" onclick="quitQuiz()">回首頁</button>
  </div>
</section>

<!-- ============ 結果頁 ============ -->
<section class="screen" id="screen-result">

  <div class="card result-hero">
    <div class="mascot" id="mascot">🌊</div>
    <div class="combo-label">你嘅心靈元素組合</div>
    <div class="combo-name" id="comboName">潮汐 × 月光</div>
    <div class="combo-sub" id="comboSub">代表物：夜光水母</div>
    <div class="element-chips" id="elementChips"></div>
  </div>

  <div class="card section">
    <h2><span class="ico">📊</span>八元素雷達圖</h2>
    <div class="radar-box">
      <canvas id="radar" width="600" height="600" style="width:min(100%,420px)"></canvas>
    </div>
    <div class="score-list" id="scoreList"></div>
  </div>

  <div class="card section">
    <h2><span class="ico">💫</span>你嘅核心</h2>
    <p id="coreText"></p>
  </div>

  <div class="card section">
    <h2><span class="ico">🫂</span>人際</h2>
    <p id="socialText"></p>
  </div>

  <div class="card section">
    <h2><span class="ico">💼</span>工作</h2>
    <p id="workText"></p>
  </div>

  <div class="card section">
    <h2><span class="ico">💗</span>愛情</h2>
    <p id="loveText"></p>
  </div>

  <div class="card section">
    <h2><span class="ico">🌧️</span>壓力</h2>
    <p id="stressText"></p>
  </div>

  <div class="card section">
    <h2><span class="ico">🌱</span>成長練習</h2>
    <p id="growthText"></p>
  </div>

  <div class="card section">
    <h2><span class="ico">🌑</span>陰影元素提醒</h2>
    <p id="shadowText"></p>
  </div>

  <div class="card section">
    <h2><span class="ico">🎀</span>分享卡</h2>
    <div class="share-card" id="shareCard">
      <span class="sc-emoji" id="scEmoji">🌊</span>
      <div class="sc-title" id="scTitle">夜光水母</div>
      <div class="sc-tag" id="scTag">潮汐 × 月光</div>
      <div class="sc-quote" id="scQuote"></div>
      <div class="sc-foot">心靈小物研究所 · 八元素靈魂圖鑑</div>
    </div>
    <div class="btn-row">
      <button class="btn ghost" onclick="downloadCard()">⬇️ 下載分享卡</button>
      <button class="btn ghost" onclick="copyResult()">📋 複製結果</button>
      <button class="btn" onclick="restart()">🔄 重新測試</button>
    </div>
  </div>

</section>

</div>

<script>
/* ============================================================
   八元素資料
   ============================================================ */
const ELEMENTS = [
  {
    key:'fire', name:'焰火', symbol:'焰', emoji:'🔥',
    color:'#FF8C69', color2:'#FFB199',
    core:'行動、熱情、勇氣',
    strong:'帶動、果斷、直接',
    blind:'衝動、易燒盡',
    species:'火花小獅',
    deco:'小火焰尾巴',
    ability:'點燃行動'
  },
  {
    key:'tide', name:'潮汐', symbol:'潮', emoji:'🌊',
    color:'#4A90D9', color2:'#8FC4EE',
    core:'共感、連結、情緒流動',
    strong:'同理、照顧、感染力',
    blind:'易吸收情緒、過度付出',
    species:'泡泡海豹',
    deco:'水波紋',
    ability:'情緒共鳴'
  },
  {
    key:'moss', name:'苔蘚', symbol:'苔', emoji:'🌿',
    color:'#7BA05B', color2:'#B4D49A',
    core:'穩定、扎根、耐性',
    strong:'可靠、實務、堅持',
    blind:'死板、慢熱',
    species:'苔苔樹懶',
    deco:'小苔蘚帽',
    ability:'穩定結界'
  },
  {
    key:'star', name:'星塵', symbol:'星', emoji:'✨',
    color:'#A48FD9', color2:'#D0C2F0',
    core:'想像、靈感、遠見',
    strong:'創意、好奇、願景',
    blind:'離地、欠跟進',
    species:'星願鯨魚',
    deco:'星塵光環',
    ability:'靈感召喚'
  },
  {
    key:'gear', name:'齒輪', symbol:'齒', emoji:'⚙️',
    color:'#7A8699', color2:'#B4BECC',
    core:'邏輯、系統、精準',
    strong:'分析、規劃、效率',
    blind:'過度控制、冷硬',
    species:'齒輪倉鼠',
    deco:'小齒輪背包',
    ability:'精準分析'
  },
  {
    key:'moon', name:'月光', symbol:'月', emoji:'🌙',
    color:'#7B96B8', color2:'#B4C8DF',
    core:'內省、直覺、神秘',
    strong:'洞察、獨立、深度',
    blind:'抽離、收埋自己',
    species:'月光貓頭鷹',
    deco:'月牙吊墜',
    ability:'直覺導航'
  },
  {
    key:'sugar', name:'糖霜', symbol:'糖', emoji:'🍬',
    color:'#F58BAE', color2:'#FFC4D6',
    core:'玩樂、幽默、即興',
    strong:'開心、靈活、冒險',
    blind:'散漫、承諾太多',
    species:'棉花糖兔',
    deco:'糖粒斑點',
    ability:'即興魔法'
  },
  {
    key:'fluff', name:'絨毛', symbol:'絨', emoji:'🧸',
    color:'#E0A860', color2:'#FFD9A8',
    core:'溫柔、安全感、修復',
    strong:'接納、療癒、陪伴',
    blind:'逃避衝突、委屈自己',
    species:'暖暖圍巾熊',
    deco:'毛毛圍巾',
    ability:'療癒擁抱'
  }
];
const E = {};
ELEMENTS.forEach((e,i)=>{ e.idx=i; E[e.key]=e; });

/* ============================================================
   36 題題庫
   ============================================================ */
const SECTIONS = ['日常篇','社交篇','工作篇','愛情篇','壓力篇','夢想篇'];
const QUESTIONS = [
/* 1-6 日常 */
{q:'朝早起身，你第一件想做的事：',s:0,a:[['拉開窗簾大叫「早晨！」','fire'],['攬住枕頭多五分鐘','fluff'],['睇吓今日行程同清單','gear'],['發呆幻想今日會遇到咩','star']]},
{q:'你間房通常係：',s:0,a:[['有系統，每樣嘢有固定位置','gear'],['亂中有序，自己搵到就得','sugar'],['好多小擺設、燈、香薰','fluff'],['簡潔，留白多，似秘密基地','moon']]},
{q:'買嘢之前，你多數：',s:0,a:[['比較規格、價錢、評價','gear'],['睇感覺，鍾意就買','tide'],['諗吓會唔會為生活帶嚟新可能','star'],['問朋友意見，一齊開心','sugar']]},

/* ============================================================
   狀態
   ============================================================ */
let currentQ = 0;
let answers = new Array(36).fill(null);
let resultData = null;

/* ============================================================
   漂浮背景
   ============================================================ */
(function makeFloaties(){
  const box = document.getElementById('floaties');
  const chars = ['🌙','✨','🫧','🍃','💫','🌸','⭐','🦋'];
  for(let i=0;i<18;i++){
    const s = document.createElement('span');
    s.className='floaty';
    s.textContent = chars[i % chars.length];
    s.style.left = Math.random()*100 + '%';
    s.style.animationDuration = (14 + Math.random()*14) + 's';
    s.style.animationDelay = (-Math.random()*22) + 's';
    s.style.fontSize = (14 + Math.random()*16) + 'px';
    box.appendChild(s);
  }
})();

/* ============================================================
   畫面切換
   ============================================================ */
function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================================================
   測驗流程
   ============================================================ */
function startQuiz(){
  currentQ = 0;
  answers = new Array(36).fill(null);
  go('screen-quiz');
  renderQ();
}

function quitQuiz(){ go('screen-landing'); }

function renderQ(){
  const q = QUESTIONS[currentQ];
  document.getElementById('qCounter').textContent = `第 ${currentQ+1} / 36 題`;
  document.getElementById('qSection').textContent = SECTIONS[q.s];
  document.getElementById('qText').textContent = q.q;
  document.getElementById('progressFill').style.width = ((currentQ)/36*100) + '%';
  document.getElementById('btnPrev').style.visibility = currentQ === 0 ? 'hidden' : 'visible';

  const box = document.getElementById('opts');
  box.innerHTML = '';
  const keys = ['A','B','C','D'];
  q.a.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt' + (answers[currentQ]===i ? ' selected' : '');
    btn.innerHTML = `<span class="key">${keys[i]}</span><span>${opt[0]}</span>`;
    btn.onclick = ()=> choose(i);
    box.appendChild(btn);
  });
}

function choose(i){
  answers[currentQ] = i;
  document.querySelectorAll('.opt').forEach((el,idx)=>{
    el.classList.toggle('selected', idx===i);
  });
  setTimeout(()=>{
    if(currentQ < 35){
      currentQ++;
      renderQ();
    } else {
      document.getElementById('progressFill').style.width = '100%';
      finish();
    }
  }, 240);
}

function prevQ(){
  if(currentQ > 0){ currentQ--; renderQ(); }
}

/* ============================================================
   計分
   ============================================================ */
function finish(){
  const scores = new Array(8).fill(0);
  answers.forEach((ansIdx, qi)=>{
    if(ansIdx === null) return;
    const key = QUESTIONS[qi].a[ansIdx][1];
    scores[E[key].idx]++;
  });

  // 排序找主/副/陰影
  const order = scores.map((v,i)=>({v,i})).sort((a,b)=> b.v - a.v || a.i - b.i);
  const mainIdx = order[0].i;
  const subIdx  = order[1].i;
  const shadowIdx = order[order.length-1].i;

  // 同分處理：若前兩名同分，標示雙主
  const tieMain = order[0].v === order[1].v;

  resultData = { scores, mainIdx, subIdx, shadowIdx, tieMain };
  renderResult();
  go('screen-result');
  setTimeout(()=> drawRadar(scores), 80);
}

function getQuote(main, sub, species){

}

/* ============================================================
   雷達圖
   ============================================================ */
function drawRadar(scores){
  const canvas = document.getElementById('radar');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2 + 10;
  const R = Math.min(W,H)*0.34;
  const N = 8;
  const maxScore = Math.max(...scores, 1);

  ctx.clearRect(0,0,W,H);

  // 背景網格
  for(let ring=1; ring<=4; ring++){
    ctx.beginPath();
    const r = R * ring/4;
    for(let i=0;i<N;i++){
      const ang = -Math.PI/2 + i*2*Math.PI/N;
      const x = cx + r*Math.cos(ang);
      const y = cy + r*Math.sin(ang);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(150,140,190,.16)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  // 軸線
  for(let i=0;i<N;i++){
    const ang = -Math.PI/2 + i*2*Math.PI/N;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx + R*Math.cos(ang), cy + R*Math.sin(ang));
    ctx.strokeStyle = 'rgba(150,140,190,.16)';
    ctx.stroke();
  }

  // 資料多邊形
  const pts = scores.map((s,i)=>{
    const ang = -Math.PI/2 + i*2*Math.PI/N;
    const r = R * (s / maxScore);
    return [cx + r*Math.cos(ang), cy + r*Math.sin(ang)];
  });

  ctx.beginPath();
  pts.forEach((p,i)=> i===0 ? ctx.moveTo(p[0],p[1]) : ctx.lineTo(p[0],p[1]));
  ctx.closePath();
  const grad = ctx.createLinearGradient(cx-R, cy-R, cx+R, cy+R);
  grad.addColorStop(0,'rgba(180,150,240,.5)');
  grad.addColorStop(0.5,'rgba(120,190,220,.45)');
  grad.addColorStop(1,'rgba(150,220,190,.5)');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,110,180,.75)';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // 資料點
  pts.forEach((p,i)=>{
    ctx.beginPath();
    ctx.arc(p[0],p[1],5,0,Math.PI*2);
    ctx.fillStyle = ELEMENTS[i].color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  // 標籤
  ctx.font = 'bold 20px "Noto Sans TC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(let i=0;i<N;i++){
    const ang = -Math.PI/2 + i*2*Math.PI/N;
    const lr = R + 38;
    const x = cx + lr*Math.cos(ang);
    const y = cy + lr*Math.sin(ang);
    ctx.fillStyle = ELEMENTS[i].color;
    ctx.fillText(ELEMENTS[i].name, x, y);
  }

  // 中心標記
  ctx.beginPath();
  ctx.arc(cx,cy,3,0,Math.PI*2);
  ctx.fillStyle = 'rgba(150,140,190,.5)';
  ctx.fill();
}

 SPECIAL_COMBO[comboKey] || main.species;

function wrapText(ctx, text, x, y, maxW, lineH){
  const chars = text.split('');
  let line = '';
  let yy = y;
  for(let i=0;i<chars.length;i++){
    const test = line + chars[i];
    if(ctx.measureText(test).width > maxW && line){
      ctx.fillText(line, x, yy);
      line = chars[i];
      yy += lineH;
    } else {
      line = test;
    }
  }
  if(line) ctx.fillText(line, x, yy);
}
